memory_limit = 512M

; Media library uploads — keep in step with the validation rules in MediaController.
upload_max_filesize = 25M
post_max_size = 25M
max_file_uploads = 20

max_execution_time = 120

opcache.enable = 1
; Off in CLI so artisan commands always see current code.
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

date.timezone = UTC
